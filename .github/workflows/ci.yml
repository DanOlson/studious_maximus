name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace and all targets
        env:
          SQLX_OFFLINE: true
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        env:
          SQLX_OFFLINE: true
        run: cargo test --workspace --all-targets --all-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

  containers:
    name: Release containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sync image
        run: docker build --file Dockerfile.sync --tag studious-sync:ci .
      - name: Build MCP image
        run: docker build --file Dockerfile.mcp --tag studious-mcp:ci .
